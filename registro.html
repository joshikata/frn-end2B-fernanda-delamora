<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro - PetSalud</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container" style="padding:40px 0;">
    <h1 class="section-title">Regístrate en VetCare</h1>
    <p>Completa tus datos para crear una cuenta y agendar una cita rápidamente.</p>
    <form action="#" method="post" style="max-width:640px;margin-top:18px;">
      <label for="name">Nombre completo</label>
      <input id="name" name="name" type="text" placeholder="Tu nombre" required style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #e6eef2;">

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" placeholder="tucorreo@ejemplo.com" required style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #e6eef2;">

      <label for="pet">Nombre de la mascota</label>
      <input id="pet" name="pet" type="text" placeholder="Nombre de tu mascota" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #e6eef2;">

      <div style="margin-top:12px;">
        <button class="btn primary" type="submit">Crear cuenta</button>
        <a href="index.html" style="margin-left:12px;text-decoration:none;color:var(--muted);">Volver</a>
      </div>
    </form>
  </main>
</body>
</html>
